<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset=".5" stop-color="#EAF3FF"/><stop offset="1" stop-color="#F5F9FF"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#4D9DFF" stop-opacity=".22"/><stop offset="1" stop-color="#4D9DFF" stop-opacity="0"/></radialGradient>
<linearGradient id="glass"><stop stop-color="#FFFFFF" stop-opacity=".72"/><stop offset="1" stop-color="#4D9DFF" stop-opacity=".08"/></linearGradient>
<linearGradient id="robot" x2="1" y2="1"><stop stop-color="#FFF"/><stop offset=".55" stop-color="#DCEEFF"/><stop offset="1" stop-color="#B9DFFF"/></linearGradient>
<pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="#9CC7F6" stroke-opacity=".18"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4D9DFF" flood-opacity=".22"/></filter>
</defs>

<rect width="100%" height="100%" fill="url(#bg)"/>
<ellipse cx="280" cy="430" rx="430" ry="420" fill="url(#halo)" filter="url(#blur)"/>
<ellipse cx="1650" cy="470" rx="420" ry="400" fill="url(#halo)" filter="url(#blur)"/>
<ellipse cx="960" cy="510" rx="470" ry="430" fill="#FFFFFF" opacity=".18"/>

<!-- edge grid; center deliberately quiet -->
<rect width="620" height="1080" fill="url(#grid)"/>
<rect x="1300" width="620" height="1080" fill="url(#grid)" opacity=".65"/>

<!-- architectural light arcs -->
<path d="M-80 780C50 300 390 120 780 180" fill="none" stroke="#4D9DFF" stroke-opacity=".28" stroke-width="3"/>
<path d="M-30 820C120 350 430 220 720 260" fill="none" stroke="#B9DFFF" stroke-opacity=".22" stroke-width="12"/>
<path d="M2000 760C1860 290 1580 150 1320 200" fill="none" stroke="#4D9DFF" stroke-opacity=".22" stroke-width="3"/>

<!-- LEFT robot scene -->
<g filter="url(#shadow)">
<ellipse cx="300" cy="750" rx="245" ry="42" fill="#4D9DFF" opacity=".13"/>
<ellipse cx="300" cy="735" rx="205" ry="34" fill="none" stroke="#4D9DFF" stroke-opacity=".55" stroke-width="3"/>
<ellipse cx="300" cy="735" rx="150" ry="22" fill="none" stroke="#B9DFFF" stroke-opacity=".7" stroke-width="2"/>
<path d="M180 735Q300 695 420 735L402 785H198Z" fill="#FFFFFF" opacity=".75" stroke="#4D9DFF" stroke-opacity=".42"/>
<ellipse cx="300" cy="720" rx="105" ry="17" fill="#4D9DFF" opacity=".2"/>

<ellipse cx="300" cy="500" rx="235" ry="82" fill="none" stroke="#4D9DFF" stroke-opacity=".4" stroke-width="2" transform="rotate(-8 300 500)"/>
<ellipse cx="300" cy="500" rx="245" ry="58" fill="none" stroke="#B9DFFF" stroke-opacity=".24" stroke-width="2" transform="rotate(20 300 500)"/>
<circle cx="525" cy="485" r="7" fill="#B9DFFF"/><circle cx="82" cy="520" r="5" fill="#4D9DFF"/>

<!-- robot -->
<g transform="translate(230 365)">
<rect x="-58" width="130" height="104" rx="38" fill="url(#robot)" stroke="#4D9DFF" stroke-width="3"/>
<rect x="-39" y="22" width="92" height="61" rx="25" fill="#071A3B"/>
<rect x="-16" y="44" width="13" height="20" rx="6" fill="#B9DFFF"/><rect x="27" y="44" width="13" height="20" rx="6" fill="#B9DFFF"/>
<circle cx="-66" cy="52" r="13" fill="#B9DFFF"/><circle cx="79" cy="52" r="13" fill="#B9DFFF"/>
<path d="M-20 104L-43 150Q-18 168 6 147L20 106" fill="url(#robot)" stroke="#4D9DFF" stroke-width="3"/>
<path d="M30 105L51 148Q27 166 2 145L-1 106" fill="url(#robot)" stroke="#4D9DFF" stroke-width="3"/>
<rect x="-20" y="118" width="40" height="17" rx="8" fill="#4D9DFF" opacity=".7"/>
</g>

<!-- glass data cards -->
<rect x="40" y="370" width="120" height="92" rx="18" fill="url(#glass)" stroke="#4D9DFF" stroke-opacity=".45"/>
<circle cx="100" cy="416" r="20" fill="none" stroke="#4D9DFF" stroke-width="3"/>
<path d="M88 420L98 410L106 418L120 404" fill="none" stroke="#4D9DFF" stroke-width="3"/>

<rect x="485" y="320" width="130" height="96" rx="18" fill="url(#glass)" stroke="#4D9DFF" stroke-opacity=".42"/>
<path d="M512 385V350M533 385V335M554 385V360M575 385V342" stroke="#4D9DFF" stroke-width="7" stroke-linecap="round"/>

<rect x="510" y="550" width="126" height="94" rx="18" fill="url(#glass)" stroke="#4D9DFF" stroke-opacity=".4"/>
<path d="M536 598Q568 566 605 591" fill="none" stroke="#4D9DFF" stroke-width="4"/>
<circle cx="536" cy="598" r="5" fill="#B9DFFF"/><circle cx="605" cy="591" r="5" fill="#B9DFFF"/>
</g>

<!-- RIGHT balancing data scene -->
<g opacity=".7">
<circle cx="1680" cy="745" r="175" fill="none" stroke="#4D9DFF" stroke-opacity=".22" stroke-width="2"/>
<circle cx="1680" cy="745" r="120" fill="none" stroke="#B9DFFF" stroke-opacity=".22" stroke-width="2"/>
<path d="M1560 745H1800M1680 625V865" stroke="#4D9DFF" stroke-opacity=".12"/>
<rect x="1500" y="390" width="155" height="108" rx="22" fill="url(#glass)" stroke="#4D9DFF" stroke-opacity=".35"/>
<path d="M1530 465L1558 438L1582 452L1615 418L1635 435" fill="none" stroke="#4D9DFF" stroke-width="4"/>
<rect x="1705" y="475" width="145" height="105" rx="22" fill="url(#glass)" stroke="#4D9DFF" stroke-opacity=".3"/>
<circle cx="1778" cy="520" r="22" fill="none" stroke="#4D9DFF" stroke-width="3"/>
<path d="M1765 520L1774 529L1793 505" fill="none" stroke="#4D9DFF" stroke-width="3"/>
</g>

<!-- subtle floor -->
<path d="M0 780Q960 650 1920 780V1080H0Z" fill="#E7F1FF" opacity=".6"/>
<path d="M0 900Q960 720 1920 900M0 1020Q960 830 1920 1020" fill="none" stroke="#4D9DFF" stroke-opacity=".12" stroke-width="2"/>
</svg>